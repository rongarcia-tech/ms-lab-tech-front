server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: todas las rutas vuelven a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip básico (opcional)
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 256;
}
