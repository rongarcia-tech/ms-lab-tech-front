<mat-toolbar color="primary" class="header-toolbar">
  <!-- Botón hamburguesa solo en pantallas < 800 -->
  <button
    *ngIf="showMenuButton"
    mat-icon-button
    (click)="onMenuClick()"
    class="menu-button"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="app-title">MEDICAL SERVICES</span>

  <span class="spacer"></span>

  <!-- Header solo si está logueado -->
  <ng-container *ngIf="loggedIn$ | async">
    <ng-container *ngIf="roles$ | async as roles">

      <!-- LABORATORIOS (ADMIN / LAB_TECH) -->
      <ng-container *ngIf="canSeeLabs(roles)">
        <button
          mat-button
          class="nav-button"
          [matMenuTriggerFor]="labsMenu"
          #labsTrigger="matMenuTrigger"
          (mouseenter)="openMenu(labsTrigger)"
          (mouseleave)="scheduleClose()"
        >
          Laboratorios
        </button>

        <mat-menu #labsMenu="matMenu" yPosition="below">
          <div (mouseenter)="cancelClose()" (mouseleave)="closeActiveMenu()">
            <!-- lectura (ADMIN / TECH) -->
            <button mat-menu-item routerLink="/labs">Labs</button>
            <button mat-menu-item routerLink="/orders">Orders</button>

            <!-- crear (solo ADMIN) -->
            <ng-container *ngIf="canCreateLabsOrdersResults(roles)">
              <mat-divider></mat-divider>
              <button mat-menu-item routerLink="/labs/new">Crear Lab</button>
              <button mat-menu-item routerLink="/orders/new">Crear Orden</button>
            </ng-container>
          </div>
        </mat-menu>
      </ng-container>

      <!-- RESULTADOS (ADMIN / LAB_TECH) -->
      <ng-container *ngIf="canSeeResults(roles)">
        <button
          mat-button
          class="nav-button"
          [matMenuTriggerFor]="resultsMenu"
          #resultsTrigger="matMenuTrigger"
          (mouseenter)="openMenu(resultsTrigger)"
          (mouseleave)="scheduleClose()"
        >
          Resultados
        </button>

        <mat-menu #resultsMenu="matMenu" yPosition="below">
          <div (mouseenter)="cancelClose()" (mouseleave)="closeActiveMenu()">
            <!-- lectura (ADMIN / TECH) -->
            <button mat-menu-item routerLink="/results">Listado</button>

            <!-- crear (solo ADMIN) -->
            <ng-container *ngIf="canCreateLabsOrdersResults(roles)">
              <mat-divider></mat-divider>
              <button mat-menu-item routerLink="/results/new">Ingresar Resultado</button>
            </ng-container>
          </div>
        </mat-menu>
      </ng-container>

      <!-- USUARIOS (solo ADMIN) -->
      <ng-container *ngIf="canManageAdmin(roles)">
        <button
          mat-button
          class="nav-button"
          [matMenuTriggerFor]="usersMenu"
          #usersTrigger="matMenuTrigger"
          (mouseenter)="openMenu(usersTrigger)"
          (mouseleave)="scheduleClose()"
        >
          Usuarios
        </button>

        <mat-menu #usersMenu="matMenu" yPosition="below">
          <div (mouseenter)="cancelClose()" (mouseleave)="closeActiveMenu()">
            <button mat-menu-item routerLink="/admin/users">Usuarios</button>
            <button mat-menu-item routerLink="/admin/roles">Roles</button>
          </div>
        </mat-menu>
      </ng-container>

      <!-- Perfil (cualquier autenticado) -->
      <button mat-button class="nav-button" routerLink="/profile">Perfil</button>

      <!-- Logout -->
      <button mat-button color="warn" (click)="logout()">Salir</button>

    </ng-container>
  </ng-container>
</mat-toolbar>
