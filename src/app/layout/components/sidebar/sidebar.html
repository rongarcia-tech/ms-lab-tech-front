<nav class="sidebar">
  <mat-nav-list *ngIf="roles$ | async as roles">

    <!-- Labs/Orders: ADMIN o LAB_TECH -->
    <ng-container *ngIf="canSeeLabs(roles)">
      <a mat-list-item routerLink="/labs" routerLinkActive="active-link">
        <mat-icon>science</mat-icon>
        <span>Laboratorios</span>
      </a>

      <a mat-list-item routerLink="/orders" routerLinkActive="active-link">
        <mat-icon>assignment</mat-icon>
        <span>Órdenes</span>
      </a>

      <!-- Crear Lab/Orden: solo ADMIN -->
      <ng-container *ngIf="isAdmin(roles)">
        <a mat-list-item routerLink="/labs/new" routerLinkActive="active-link">
          <mat-icon>add_business</mat-icon>
          <span>Crear Lab</span>
        </a>

        <a mat-list-item routerLink="/orders/new" routerLinkActive="active-link">
          <mat-icon>post_add</mat-icon>
          <span>Crear Orden</span>
        </a>
      </ng-container>
    </ng-container>

    <!-- Results: ADMIN o LAB_TECH -->
    <ng-container *ngIf="canSeeResults(roles)">
      <a mat-list-item routerLink="/results" routerLinkActive="active-link">
        <mat-icon>biotech</mat-icon>
        <span>Resultados</span>
      </a>

      <!-- Crear Result: solo ADMIN -->
      <ng-container *ngIf="isAdmin(roles)">
        <a mat-list-item routerLink="/results/new" routerLinkActive="active-link">
          <mat-icon>playlist_add</mat-icon>
          <span>Ingresar Resultado</span>
        </a>
      </ng-container>
    </ng-container>

    <!-- Admin users/roles: solo ADMIN -->
    <ng-container *ngIf="isAdmin(roles)">
      <a mat-list-item routerLink="/admin/users" routerLinkActive="active-link">
        <mat-icon>group</mat-icon>
        <span>Usuarios</span>
      </a>

      <a mat-list-item routerLink="/admin/roles" routerLinkActive="active-link">
        <mat-icon>security</mat-icon>
        <span>Roles</span>
      </a>
    </ng-container>

    <!-- Perfil: cualquier autenticado -->
    <a mat-list-item routerLink="/profile" routerLinkActive="active-link">
      <mat-icon>person</mat-icon>
      <span>Perfil</span>
    </a>

  </mat-nav-list>
</nav>
