<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header class="card-header-center">
        <mat-card-title>MEDICAL SERVICES</mat-card-title>
        <mat-icon class="lab-icon">medical_services</mat-icon>
        <mat-card-subtitle>Inicia sesion</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="tu-usuario">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
  <mat-label>Contraseña</mat-label>
  <input
    matInput
    formControlName="password"
    
    [type]="hidePassword ? 'password' : 'text'"
    
    placeholder="••••••••"
    autocomplete="new-password"
  >
  <button 
    mat-icon-button 
    matSuffix 
    type="button" 
    (click)="togglePasswordVisibility()" 
    aria-label="Toggle password visibility"
  >
    <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
  </button>
</mat-form-field>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <mat-card-actions>
      <button
        mat-flat-button
        color="primary"
        class="full-width"
        type="submit"
        [disabled]="form.invalid || loading"
        (click)="onSubmit()"
      >
        {{ loading ? 'Ingresando...' : 'Entrar' }}
      </button>
    </mat-card-actions>
      </form>
    </mat-card-content>

    
  </mat-card>
</div>
