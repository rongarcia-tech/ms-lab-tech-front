<div class="user-form-page">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{ isEdit ? 'Editar usuario' : 'Crear usuario' }}</mat-card-title>
      <mat-card-subtitle>MS Auth (8080) /users</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" [readonly]="isEdit">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email">
        </mat-form-field>

        <mat-form-field *ngIf="!isEdit" appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>LabCode</mat-label>
          <input matInput formControlName="labCode">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Roles</mat-label>
          <mat-select formControlName="roles" multiple>
            <mat-option *ngFor="let r of (roles$ | async)" [value]="r">{{ r }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-slide-toggle formControlName="active">Activo</mat-slide-toggle>

        <div class="actions">
          <button mat-button type="button" routerLink="/admin/users">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
            {{ loading ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
