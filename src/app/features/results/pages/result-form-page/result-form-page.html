<div class="result-form-page">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{ isEdit ? 'Editar resultado' : 'Crear resultado' }}</mat-card-title>
      <mat-card-subtitle>MS Results (8082) /results</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Order External ID</mat-label>
          <input matInput formControlName="orderExternalId" placeholder="ORD-xxxx" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Patient ID</mat-label>
          <input matInput formControlName="patientId" placeholder="rut:22.222.222-2" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Test Code</mat-label>
          <input matInput formControlName="testCode" placeholder="PCR" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Test Name</mat-label>
          <input matInput formControlName="testName" placeholder="Proteína C Reactiva" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Value (texto)</mat-label>
          <input matInput formControlName="valueText" placeholder="Negativo / Positivo / Observación" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Value (numérico)</mat-label>
          <input matInput type="number" formControlName="valueNumber" placeholder="12.3" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Unit</mat-label>
          <input matInput formControlName="unit" placeholder="mg/dL" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Reference Range</mat-label>
          <input matInput formControlName="referenceRange" placeholder="0 - 10" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Flag</mat-label>
          <mat-select formControlName="flag">
            <mat-option *ngFor="let f of flags" [value]="f">{{ f }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option *ngFor="let s of statuses" [value]="s">{{ s }}</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="actions">
          <button mat-button type="button" routerLink="/results">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
            {{ loading ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
