<div class="lab-form-page">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{ isEdit ? 'Editar laboratorio' : 'Crear laboratorio' }}</mat-card-title>
      <mat-card-subtitle>MS Labs (8081) /labs</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Código</mat-label>
          <input matInput formControlName="code" [readonly]="isEdit" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Dirección</mat-label>
          <input matInput formControlName="address" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phone" />
        </mat-form-field>

        <mat-form-field *ngIf="!isEdit" appearance="outline" class="full-width">
          <mat-label>Supported Tests (CSV)</mat-label>
          <input matInput formControlName="supportedTests" placeholder="HEMOGRAMA,PCR,PERFIL_LIPIDICO" />
        </mat-form-field>

        <div class="actions">
          <button mat-button type="button" routerLink="/labs">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
            {{ loading ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
